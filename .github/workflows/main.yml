
name: Build AutoPlay AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify Java
        run: java -version

      - name: Build mod
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            echo "ERROR: Gradle wrapper (gradlew) is missing."
            exit 1
          fi

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlay-AI
          path: build/libs/*.jar
          if-no-files-found: error
